name: 'news_analytics'
version: '1.0.0'
config-version: 2

profile: 'news_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

# FAANG Enterprise Data Modeling Configurations:
# Enforces Incremental materialization and B-Tree timestamp clustering globally across warehouse models
models:
  news_analytics:
    staging:
      +materialized: view
    core:
      +materialized: incremental
      +unique_key: article_id
      +indexes:
        - columns: ["event_timestamp"]
          type: btree